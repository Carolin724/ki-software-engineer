<header class="bg-white shadow">
  <div class="container mx-auto px-4 py-6">
    <div class="flex items-center justify-between gap-4">
      <a routerLink="/" class="text-3xl font-bold text-blue-600">BookMonkey</a>
      <nav aria-label="Hauptnavigation">
        <a routerLink="/favoriten" routerLinkActive="font-bold" class="text-blue-700 hover:underline">Favoriten</a>
      </nav>
    </div>
  </div>
</header>

<main>
  <div *ngIf="storageWarning()" class="bg-yellow-100 px-4 py-3 text-center text-yellow-900" role="alert">
    {{ storageWarning() }}
  </div>
  <router-outlet></router-outlet>
</main>

<footer class="bg-gray-100 mt-12">
  <div class="container mx-auto px-4 py-6">
    <p class="text-center text-gray-600 text-sm">© 2023 BookMonkey App – Angular Workshop by workshops.de</p>
  </div>
</footer>

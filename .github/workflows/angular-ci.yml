name: Angular CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    name: Angular build
    if: >-
      github.repository == 'Carolin724/ki-software-engineer' &&
      github.event.pull_request.number != 9 && github.event.pull_request.number != 11
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Build exactly the PR head; the repair PR will target that source branch.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build Angular
        run: npm run build
